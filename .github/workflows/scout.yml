name: scout
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: bot-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python bot.py scout
        env:
          HELIUS_KEY: ${{ secrets.HELIUS_KEY }}
          WALLET_BOT_TOKEN: ${{ secrets.WALLET_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MAX_TRADES_PER_DAY: "500"
          MAX_TOP_SHARE: "0.85"
          MIN_WINRATE: "0.4"
          MIN_CLOSED: "5"
          HISTORY_TXS: "300"
      - name: Save state
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A state/
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase && git push)
